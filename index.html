<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le Wagon - Web Development Sprint</title>

  <!-- Change these Google fonts with your own choice -->
  <link href="https://fonts.googleapis.com/css?family=Chivo:700|Overpass:400,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Banner section -->
  <header class="banner">
    <h1>Live your change, code to learn</h1>
    <h2>Le Wagon brings technical skills to creative people</h2>
    <a href="https://www.lewagon.com" target="_blank" class="btn-blue">Apply now</a>
  </header>
  <!-- Cards section -->
  <div id="container">
    <h2>Discover our campuses</h2>
    <div class="cards">
      <div class="card">
        <img src="images/shanghai.jpg" alt="Shanghai">
        <h3>Shanghai</h3>
        <p>Learn to code with us in Shanghai.</p>
      </div>
      <div class="card">
        <img src="images/london.jpg" alt="London">
        <h3>London</h3>
        <p>Learn to code with us in London.</p>
      </div>
      <div class="card">
        <img src="images/paris.jpg" alt="Paris">
        <h3>Paris</h3>
        <p>Learn to code with us in Paris.</p>
      </div>
    </div>
  </div>
  <!-- Footer section -->
   <footer class="footer">
    <p>Website made with ❤️ with Le Wagon</p>
   </footer>
</body>
</html>
